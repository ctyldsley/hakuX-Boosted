# hakuX-Boosted: builds the whole app (hakuX's core, the Xbox 360 core, the
# APK with both) on every push to a work branch, and on request.
name: hakuX-Boosted

on:
  push:
    branches:
      - 'claude/**'
      - 'boosted/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a run that is still going: only the newest commit's
# APK is wanted, and a run stuck on the runner's side would hold up the next.
concurrency:
  group: boosted-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.30.3
  USE_CCACHE: 'true'
  CCACHE_COMPILERCHECK: content

jobs:
  # hakuX's own core: libhakuxcore.so and the libraries it loads.
  xbox-core:
    name: Xbox core (hakuX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: FEX (submodule, with the submodules it builds with)
        run: |
          git submodule update --init --depth 1 external/fex
          git -C external/fex submodule update --init --depth 1 \
            External/fmt External/range-v3 External/rpmalloc \
            External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Tools
        run: |
          boosted/tools/ci-apt.sh ninja-build ccache
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: xbox-core-ndk${{ env.NDK_VERSION }}
          max-size: 1G

      - name: Build
        run: boosted/tools/build-xbox-core.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xbox-core-libs
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          retention-days: 7

  # The APK: the Xbox 360 core is built by Gradle (the x360-core module),
  # hakuX's comes from the job above.
  apk:
    name: APK (both cores)
    needs: xbox-core
    # still built when hakuX's core failed: the 360 side's build is checked,
    # and the APK then lacks the Xbox core (the step below says so)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: The 360 side's submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8 -- x360

      - name: Tools
        run: |
          boosted/tools/ci-apt.sh ninja-build ccache python3 glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36" "build-tools;36.1.0"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: x360-core-ndk${{ env.NDK_VERSION }}
          max-size: 2G

      - name: hakuX's core libraries
        id: xbox
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: xbox-core-libs
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Without hakuX's core
        if: steps.xbox.outcome != 'success'
        run: echo "::warning::hakuX's core libraries are missing (the Xbox core job failed), this APK runs Xbox 360 titles only"

      # The Turnip packages the app ships with, as boosted/drivers/turnip.lock.json
      # pins them; a newer upstream release is only pointed out (the Turnip
      # sync workflow moves the lock).
      - name: Bundled Turnip driver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 boosted/tools/fetch-turnip.py
          python3 boosted/tools/fetch-turnip.py --check || true

      # One debug key for every build (boosted/android/signing): a runner's own
      # is new each run, and a build signed with another key can't be installed
      # over the last one without uninstalling it, saves and settings included.
      - name: The fork's debug signing key
        run: |
          # Handed to the Android Gradle plugin by its signing properties on
          # the build's command line. Copying it to ~/.android, as was done
          # until run 26, did nothing: every APK came out under a different
          # certificate. Fails here if Java cannot read the keystore, and in
          # the job's last step if the APK is not signed with it.
          "$JAVA_HOME_21_X64/bin/keytool" -list -v -alias androiddebugkey \
            -keystore boosted/android/signing/debug.keystore -storepass android \
            | grep -E 'Alias name|SHA256:'

      - name: Build the debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # the repository's gradle.properties names the upstream author's JDK
          # path and a 2 GB heap: this runner's JDK 21, and room for R8 over
          # both sides' code
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME_21_X64" \
            -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/boosted/android/signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # The log says what was built: both cores' libraries, the hook
      # libraries once each, both sides' activities, the bundled title files.
      # The log says how the 360 core was compiled: its CMake configuration
      # and the optimization flags of one of its sources.
      - name: How the 360 core was compiled
        run: |
          python3 - <<'PY'
          import glob, json, re
          found = False
          for path in glob.glob('boosted/android/x360-core/.cxx/**/compile_commands.json', recursive=True):
              for entry in json.load(open(path)):
                  if entry['file'].endswith('gpu/vulkan/vulkan_command_processor.cc'):
                      command = entry.get('command') or ' '.join(entry.get('arguments', []))
                      flags = [f for f in command.split() if re.match(r'-O|-flto|-DNDEBUG|-DDEBUG|-g$|-march|-fomit|-fno-omit', f)]
                      print(path)
                      print('  flags in order:', ' '.join(flags))
                      found = True
          for path in glob.glob('boosted/android/x360-core/.cxx/**/CMakeCache.txt', recursive=True):
              for line in open(path):
                  if line.startswith('CMAKE_BUILD_TYPE'):
                      print(path, line.strip())
          if not found:
              print('::error::no compile command found for the 360 core')
              raise SystemExit(1)
          # The job fails unless the core is the optimized one: -O3 the last
          # -O flag, ThinLTO on, and xenia's Release configuration.
          last_o = [f for f in flags if f.startswith('-O')][-1:]
          if last_o != ['-O3'] or '-flto=thin' not in flags:
              print('::error::the 360 core is not built -O3 with ThinLTO:', ' '.join(flags))
              raise SystemExit(1)
          PY

      - name: What the APK holds
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          ls -la "$apk"
          # signed with the fork's key, so that it installs over the last build
          want=$("$JAVA_HOME_21_X64/bin/keytool" -list -v -alias androiddebugkey \
            -keystore boosted/android/signing/debug.keystore -storepass android \
            | sed -n 's/.*SHA256: //p' | tr -d ': ' | tr 'A-F' 'a-f')
          have=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "APK certificate $have, the fork's key $want"
          if [ -z "$have" ] || [ "$have" != "$want" ]; then
            echo "::error::the APK is not signed with the fork's debug key"; exit 1
          fi
          unzip -l "$apk" | grep -E ' lib/' || true
          echo "game patches: $(unzip -l "$apk" | grep -c ' assets/game-patches/')"
          unzip -l "$apk" | grep -E ' assets/(title-defaults|config)/' || true
          echo "hakuX mods: $(unzip -l "$apk" | grep -c ' assets/mods/')"
          unzip -l "$apk" | grep -E ' assets/gpu-drivers/' || true
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump xmltree "$apk" --file AndroidManifest.xml \
            | grep -E 'E: (activity|service|provider|uses-sdk|uses-permission)|A: .*(:name|:process|minSdkVersion)' \
            | sed 's/ (Raw: .*//' || true
          missing=0
          for lib in libe.so libhardware_ProcessorInfo.so libmain_hook.so libfile_redirect_hook.so \
                     libgsl_alloc_hook.so libkgsl_context_hook.so libhook_impl.so; do
            n=$(unzip -l "$apk" | grep -c " lib/arm64-v8a/$lib\$" || true)
            if [ "$n" != "1" ]; then echo "::error::$lib: $n copies in the APK"; missing=1; fi
          done
          for f in turnip.lock.json $(python3 -c "import json; print(' '.join(p['file'] for p in json.load(open('boosted/drivers/turnip.lock.json'))['packages']))"); do
            unzip -l "$apk" | grep -q " assets/gpu-drivers/$f\$" || { echo "::error::the bundled driver's $f is not in the APK"; missing=1; }
          done
          if [ "${{ steps.xbox.outcome }}" = "success" ]; then
            for lib in libhakuxcore.so libSDL3.so; do
              unzip -l "$apk" | grep -q " lib/arm64-v8a/$lib\$" || { echo "::error::$lib is not in the APK"; missing=1; }
            done
          fi
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-Boosted-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # The translator's tests: upstream's PowerPC instruction tests and the
  # fork's sequence tests, translated by the ARM64 back end and run under
  # qemu, once with every translator setting at its default and once for
  # each line of cpu/ppc/testing/ci/matrix.txt. Independent of the two jobs
  # above: it builds only the CPU sources (cpu/ppc/testing/ci/CMakeLists.txt).
  ppc-tests:
    name: Translator tests (PowerPC on the ARM64 back end)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      XE: x360/emulator-core/src/main/cpp/xenia
    steps:
      - uses: actions/checkout@v4

      - name: The submodules the CPU sources need
        run: |
          tp=$XE/third_party
          git submodule update --init --depth 1 -- $tp/xbyak_aarch64 $tp/fmt \
            $tp/capstone $tp/cxxopts $tp/date $tp/tomlplusplus $tp/utfcpp \
            $tp/xxhash $tp/disruptorplus $tp/boost_context/context

      - name: Tools
        run: |
          boosted/tools/ci-apt.sh ninja-build ccache clang qemu-user \
            g++-aarch64-linux-gnu texinfo flex bison
          qemu-aarch64 --version | head -1
          clang --version | head -1

      # The PowerPC assembler for the test sources: binutils 2.24 with
      # xenia's VMX128 patch. Built once and kept.
      - uses: actions/cache@v4
        id: binutils
        with:
          path: ~/ppc-binutils
          key: ppc-binutils-2.24-vmx128-${{ hashFiles('x360/emulator-core/src/main/cpp/xenia/third_party/binutils/binutils-2.24-vmx128.patch', 'x360/emulator-core/src/main/cpp/xenia/src/xenia/cpu/ppc/testing/ci/build-binutils.sh') }}

      - name: Build the PowerPC assembler
        if: steps.binutils.outputs.cache-hit != 'true'
        run: $XE/src/xenia/cpu/ppc/testing/ci/build-binutils.sh ~/ppc-binutils

      - name: Assemble the tests
        run: $XE/src/xenia/cpu/ppc/testing/ci/gen-tests.sh ~/ppc-binutils/bin "$RUNNER_TEMP/ppc-test-bin"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ppc-tests-aarch64-cross
          max-size: 1G

      - name: Build the test runner (ARM64, cross-compiled)
        run: |
          ci=$XE/src/xenia/cpu/ppc/testing/ci
          cmake -S $ci -B "$RUNNER_TEMP/ppc-tests" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/$ci/aarch64-cross.cmake \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ninja -C "$RUNNER_TEMP/ppc-tests"

      - name: Run the tests with each translator setting
        env:
          WRAPPER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: |
          $XE/src/xenia/cpu/ppc/testing/ci/run-matrix.sh \
            "$RUNNER_TEMP/ppc-tests/xenia-cpu-ppc-tests" "$RUNNER_TEMP/ppc-test-bin"
