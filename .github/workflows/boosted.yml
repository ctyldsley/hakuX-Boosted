# hakuX-Boosted: builds the whole app (hakuX's core, the Xbox 360 core, the
# APK with both) on every push to a work branch, and on request.
name: hakuX-Boosted

on:
  push:
    branches:
      - 'claude/**'
      - 'boosted/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a run that is still going: only the newest commit's
# APK is wanted, and a run stuck on the runner's side would hold up the next.
concurrency:
  group: boosted-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.30.3
  USE_CCACHE: 'true'
  CCACHE_COMPILERCHECK: content

jobs:
  # hakuX's own core: libhakuxcore.so and the libraries it loads.
  xbox-core:
    name: Xbox core (hakuX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: FEX (submodule, with the submodules it builds with)
        run: |
          git submodule update --init --depth 1 external/fex
          git -C external/fex submodule update --init --depth 1 \
            External/fmt External/range-v3 External/rpmalloc \
            External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Tools
        run: |
          boosted/tools/ci-apt.sh ninja-build ccache
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: xbox-core-ndk${{ env.NDK_VERSION }}
          max-size: 1G

      - name: Build
        run: boosted/tools/build-xbox-core.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xbox-core-libs
          path: android/app/src/main/jniLibs/arm64-v8a/*.so
          retention-days: 7

  # The APK: the Xbox 360 core is built by Gradle (the x360-core module),
  # hakuX's comes from the job above.
  apk:
    name: APK (both cores)
    needs: xbox-core
    # still built when hakuX's core failed: the 360 side's build is checked,
    # and the APK then lacks the Xbox core (the step below says so)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: The 360 side's submodules
        run: git submodule update --init --recursive --depth 1 --jobs 8 -- x360

      - name: Tools
        run: |
          boosted/tools/ci-apt.sh ninja-build ccache python3 glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36" "build-tools;36.1.0"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: x360-core-ndk${{ env.NDK_VERSION }}
          max-size: 2G

      - name: hakuX's core libraries
        id: xbox
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: xbox-core-libs
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Without hakuX's core
        if: steps.xbox.outcome != 'success'
        run: echo "::warning::hakuX's core libraries are missing (the Xbox core job failed), this APK runs Xbox 360 titles only"

      # The Turnip packages the app ships with, as boosted/drivers/turnip.lock.json
      # pins them; a newer upstream release is only pointed out (the Turnip
      # sync workflow moves the lock).
      - name: Bundled Turnip driver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 boosted/tools/fetch-turnip.py
          python3 boosted/tools/fetch-turnip.py --check || true

      # One debug key for every build (boosted/android/signing): a runner's own
      # is new each run, and a build signed with another key can't be installed
      # over the last one without uninstalling it, saves and settings included.
      - name: The fork's debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp boosted/android/signing/debug.keystore "$HOME/.android/debug.keystore"

      - name: Build the debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # the repository's gradle.properties names the upstream author's JDK
          # path and a 2 GB heap: this runner's JDK 21, and room for R8 over
          # both sides' code
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.java.home="$JAVA_HOME_21_X64" \
            -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8"

      # The log says what was built: both cores' libraries, the hook
      # libraries once each, both sides' activities, the bundled title files.
      - name: What the APK holds
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          ls -la "$apk"
          unzip -l "$apk" | grep -E ' lib/' || true
          echo "game patches: $(unzip -l "$apk" | grep -c ' assets/game-patches/')"
          unzip -l "$apk" | grep -E ' assets/(title-defaults|config)/' || true
          echo "hakuX mods: $(unzip -l "$apk" | grep -c ' assets/mods/')"
          unzip -l "$apk" | grep -E ' assets/gpu-drivers/' || true
          "$ANDROID_HOME/build-tools/36.1.0/aapt2" dump xmltree "$apk" --file AndroidManifest.xml \
            | grep -E 'E: (activity|service|provider|uses-sdk|uses-permission)|A: .*(:name|:process|minSdkVersion)' \
            | sed 's/ (Raw: .*//' || true
          missing=0
          for lib in libe.so libhardware_ProcessorInfo.so libmain_hook.so libfile_redirect_hook.so \
                     libgsl_alloc_hook.so libkgsl_context_hook.so libhook_impl.so; do
            n=$(unzip -l "$apk" | grep -c " lib/arm64-v8a/$lib\$" || true)
            if [ "$n" != "1" ]; then echo "::error::$lib: $n copies in the APK"; missing=1; fi
          done
          for f in turnip.lock.json $(python3 -c "import json; print(' '.join(p['file'] for p in json.load(open('boosted/drivers/turnip.lock.json'))['packages']))"); do
            unzip -l "$apk" | grep -q " assets/gpu-drivers/$f\$" || { echo "::error::the bundled driver's $f is not in the APK"; missing=1; }
          done
          if [ "${{ steps.xbox.outcome }}" = "success" ]; then
            for lib in libhakuxcore.so libSDL3.so; do
              unzip -l "$apk" | grep -q " lib/arm64-v8a/$lib\$" || { echo "::error::$lib is not in the APK"; missing=1; }
            done
          fi
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-Boosted-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
